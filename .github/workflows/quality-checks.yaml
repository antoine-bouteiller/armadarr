name: Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Install dependencies
        run: pnpm --dir app/frontend install --frozen-lockfile

      - name: Check client
        run: |
          pnpm --dir app/frontend exec vp check
          pnpm --dir app/frontend run check:svelte

      - name: Check formatting outside the client
        run: app/frontend/node_modules/.bin/oxfmt -c app/frontend/node_modules/@antoine-bouteiller/devkit/dist/fmt.json --check '**/*.{md,yml,yaml,json5}' '!app/frontend/**'

      - name: Check server
        run: |
          golangci-lint fmt --diff ./...
          golangci-lint run ./...
          go mod tidy -diff

      - name: Check API contract
        run: |
          buf lint
          buf generate
          git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Install dependencies
        run: pnpm --dir app/frontend install --frozen-lockfile

      - name: Run tests
        run: |
          go test ./...
          pnpm --dir app/frontend test

  nix-hashes:
    name: Nix Hashes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.NIX_UPDATE_GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Lock flake inputs
        run: nix flake lock

      - name: Recompute dependency hashes
        run: scripts/update_nix_hashes.sh

      - name: Commit and push regenerated Nix files
        run: |
          git diff --quiet flake.lock flake.nix && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock flake.nix
          git commit --no-verify -m "chore: regenerate Nix hashes and flake lock"
          git push
          exit 1

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Install dependencies
        run: pnpm --dir app/frontend install --frozen-lockfile

      - name: Run knip
        run: pnpm --dir app/frontend knip

      - name: Run knip (production)
        run: pnpm --dir app/frontend knip:production

  build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Build package
        shell: bash
        run: nix build .#default -L
